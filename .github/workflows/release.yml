name: AssetVault Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release Binary
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Backend Test Suite
        run: |
          python tests/run_tests.py

      - name: Build Standalone Desktop Executable
        run: |
          python build_desktop.py

      - name: Create GitHub Release & Upload AssetVault.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AssetVault.exe
          name: AssetVault ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🏛️ AssetVault Standalone Windows Desktop Application

            #### 🚀 Highlights & Features:
            - **Portable Executable**: Standalone `AssetVault.exe` for Windows 10 & 11 (zero Python/Node prerequisites).
            - **Dedicated "Other Files" Tab**: Complete support for non-media assets (`.zip`, `.blend`, `.exe`, `.py`, `.iso`, `.json`, `.obj`, etc.) in a dedicated tab with custom format badge thumbnails, keeping the media grid clean.
            - **User-Configurable Category File Types**: Manually map and customize file extensions for Documents, Images, Videos, and Audio via UI settings modal with live database re-classification.
            - **High-Performance Scanning Engine**: Optimized library scanner processing 9,000+ assets in under 10 seconds (>1,000 files/sec) with lazy thumbnailing and batched commits.
            - **Smart In-Place Move Reconciliation**: Automatically detects externally moved files by name & size, preserving tags, UUIDs, and metadata without re-importing.
            - **Automatic Orphan Purge**: Automatically cleans up database records for missing or externally removed files during library scans.
            - **In-Place Multi-Folder Reference Mode**: Indexes and watches folders directly on disk without duplicating files.
            - **Subfolder Hierarchy Tree**: Collapsible nested folder tree with real-time asset count badges.
            - **Multi-Tag Search & Filter**: Instant search with AND-logic tag filtering.
            - **Full-Screen Media Previewer**: Interactive viewer for Images, Videos, Audio, and PDFs.

            #### 📦 Download:
            Download **`AssetVault.exe`** below and double-click to launch!

